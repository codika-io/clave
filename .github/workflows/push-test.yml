# Temporary: validates that the release deploy key can push to prod through
# the "prod is release-only" ruleset. Delete after one successful run.
name: Push-access test

on: workflow_dispatch

permissions:
  contents: read

jobs:
  test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod

      - name: Push empty commit to prod via deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ~/.ssh
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes"
          git remote set-url --push origin git@github.com:codika-io/clave.git
          git commit --allow-empty -m "ci: deploy-key push-access test [skip ci]"
          git push origin HEAD:prod
